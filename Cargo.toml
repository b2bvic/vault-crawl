[workspace]
members = [
    "crates/vault-crawl-core",
    "crates/vault-crawl-adapters",
    "crates/vault-crawl-cli",
    "crates/vault-crawl-fixtures",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Victor Romo"]
repository = "https://github.com/b2bvic/vault-crawl"

[workspace.dependencies]
clap = { version = "=4.6.3", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
brotli = "=8.0.4"
encoding_rs = "=0.8.35"
flate2 = "=1.1.9"
feed-rs = "=2.4.0"
html2md = "=0.2.15"
pdf-extract = "=0.12.0"
quick-xml = "=0.41.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
robotstxt = "=0.3.0"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
scraper = "=0.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.19"
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
zstd = "=0.13.3"
vault-crawl-core = { path = "crates/vault-crawl-core" }
vault-crawl-fixtures = { path = "crates/vault-crawl-fixtures" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
